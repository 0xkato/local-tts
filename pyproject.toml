[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tts"
version = "1.1.1"
description = "Listen to articles read by neural voices that run on your own machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pygame>=2.5.2,<3"]

[project.optional-dependencies]
# The voices. They go in an environment of their own (Python 3.11+), which the
# app runs as a worker process -- see Quick Start in the README.
voices = [
    "ptts==0.7.1",       # Phonon: light, runs anywhere
    "numpy>=1.26",
    # Kokoro and Ming run on Apple Silicon through MLX
    "mlx-audio==0.6.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]==0.9.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/0xkato/local-tts"

[project.scripts]
local-tts = "local_tts.app:main"

[tool.setuptools]
packages = ["local_tts", "local_tts.voices"]
