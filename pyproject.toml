[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tts"
version = "1.0.1"
description = "Listen to articles read by neural voices that run on your own machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pygame>=2.5.2,<3"]

[project.scripts]
local-tts = "local_tts.app:main"

[tool.setuptools]
packages = ["local_tts", "local_tts.voices"]
